
services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: lc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lc_user
      POSTGRES_PASSWORD: lc_password
      POSTGRES_DB: lc_db
    volumes:
      - lc-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc_user -d lc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lc-network

  # Main application
  app:
    container_name: lc-app
    build: .
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.prod.env:/app/.prod.env:ro
    environment:
      - SANDBOX_CONTAINER=lc-sandbox
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=lc_user
      - DB_PASSWORD=lc_password
      - DB_NAME=lc_db
    depends_on:
      sandbox:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lc-network

  # Test service
  test:
    profiles:
      - test
    build:
      context: .
      target: builder
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - SANDBOX_CONTAINER=lc-sandbox
    command: go test -v -race -coverprofile=coverage.out ./tests/... ./internal/...
    networks:
      - lc-network
    depends_on:
      - sandbox
    # Service only runs when explicitly invoked with 'docker-compose run --profile test test'

  # Sandbox container for code execution
  sandbox:
    image: golang:1.23-alpine
    container_name: lc-sandbox
    command: sh -c "apk add --no-cache python3 py3-pip coreutils && python3 --version && sleep infinity"
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:rw,exec,size=200m
      - /go:rw,exec,size=300m
    restart: unless-stopped
    networks:
      - lc-network
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp || mkdir -p /tmp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  go-mod-cache:
  lc-db-data:

networks:
  lc-network:
    driver: bridge
